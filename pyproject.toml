[project]
name = "sih"
version = "0.1.0"
description = "SIH problem statement scraper, MCP server and CLI"
authors = [
    { name = "Krishaay Jois", email = "krishaayjois@gmail.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
sih = "sih.cli:app"
sih-mcp = "sih.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
